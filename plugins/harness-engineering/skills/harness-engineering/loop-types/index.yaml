# Generated by scripts/catalog.py from the frontmatter of loop-types/<group>/<id>.md.
# Do not edit by hand: change the card, then run `python3 scripts/catalog.py index`.

groups:
  code: "Code correctness and maintainability (static, seconds)"
  testing: "Testability and functional correctness"
  security: "Security, compliance, audit"
  compatibility: "Compatibility, integrability, flexibility"
  performance: "Performance and scalability"
  observability: "Observability and debuggability"
  reliability: "Reliability and resilience"
  delivery: "Deployability and reproducibility"
  production: "Production signals"
  interaction: "Interaction and accessibility"
  meta: "Inferential and meta loops"
  human: "Human in the loop"

loop_types:
  - id: architecture-fitness-functions
    title: "Architecture fitness functions"
    group: code
    path: code/architecture-fitness-functions.md
    summary: "The agent adds an import and runs `dependency-cruiser` or ArchUnit. If the import breaks a rule, the agent sees a message that names the rule and describes the layers, such as:"
    qualities: [modularity, modifiability, evolvability]
    stages: [commit, ci]
    speed: [seconds]
  - id: autoformat-hook
    title: "Auto-formatting hook"
    group: code
    path: code/autoformat-hook.md
    summary: "After every file write a hook formats the code, so the agent spends no iterations on style."
    qualities: [maintainability]
    stages: [edit, local]
    speed: [sub-second]
  - id: build
    title: "Build / compile"
    group: code
    path: code/build.md
    summary: "The agent edits code and runs `build`. It reads compiler errors with file and line and fixes them until the command exits with code 0."
    qualities: [correctness, analysability]
    stages: [local, ci]
    speed: [seconds]
  - id: coupling-analysis
    title: "Coupling analysis"
    group: code
    path: code/coupling-analysis.md
    summary: "The agent calls a CLI that reports fan-in, fan-out and dependency cycles. It then refactors the hot spots using the numbers from that tool, not its own judgement of the code."
    qualities: [modularity]
    stages: [scheduled]
    speed: [minutes]
  - id: knowledge-base-doc-lint
    title: "Doc linters for the knowledge base"
    group: code
    path: code/knowledge-base-doc-lint.md
    summary: "CI checks that the `docs/` folder is current, cross-linked and correctly structured. The agent reads the errors CI reports and fixes the docs."
    qualities: [understandability, supportability]
    stages: [ci, scheduled]
  - id: lint-with-fix-instructions
    title: "Linter with fix instructions"
    group: code
    path: code/lint-with-fix-instructions.md
    summary: "The agent runs the linter and reads each violation together with a \"how to fix\" text. Then it either fixes the violation or suppresses it with a justification."
    qualities: [maintainability]
    stages: [commit, ci]
    speed: [seconds]
  - id: lsp-diagnostics
    title: "LSP diagnostics after every edit"
    group: code
    path: code/lsp-diagnostics.md
    summary: "Right after every edit the agent gets the language server's diagnostics, before any build."
    qualities: [analysability]
    stages: [edit, local]
    speed: [sub-second]
  - id: taste-invariants
    title: "Taste invariants: custom lints"
    group: code
    path: code/taste-invariants.md
    summary: "The agent breaks a team convention, such as an unstructured log line, a schema name or a file size. A custom lint finds the violation, locally or in CI, within seconds. The lint error tells the agent how to fix the violation, and the agent follows that instruction."
    qualities: [consistency, observability]
    stages: [local, ci]
    speed: [seconds]
  - id: type-check
    title: "Type checking"
    group: code
    path: code/type-check.md
    summary: "The agent runs `tsc --noEmit`, `mypy` or `pyright` and fixes the type mismatches it finds."
    qualities: [correctness, analysability]
    stages: [local]
    speed: [seconds]
  - id: agentic-manual-testing
    title: "Agentic manual testing"
    group: testing
    path: testing/agentic-manual-testing.md
    summary: "The agent checks the code by hand: `python -c`, temporary files in `/tmp`, `curl`, a browser. When the agent finds a defect, it locks the fix in with a permanent test, written red/green ([red-green-tdd](red-green-tdd.md))."
    qualities: [correctness, demonstrability]
    stages: [local]
  - id: approved-fixtures
    title: "Snapshot / golden / approved fixtures"
    group: testing
    path: testing/approved-fixtures.md
    summary: "A test compares the output with a reference. When the test shows a diff: if the diff is unexpected, the agent fixes it; if the diff is expected, the agent proposes it to a person as the new reference."
    qualities: [correctness, stability]
    stages: [local]
    speed: [seconds]
  - id: bug-failing-test-fix
    title: "Bug → failing test → fix"
    group: testing
    path: testing/bug-failing-test-fix.md
    summary: "The agent reproduces the bug with a test, fixes the code and shows a green run."
    qualities: [reproducibility, debuggability]
    stages: [local]
  - id: code-coverage
    title: "Code coverage"
    group: testing
    path: testing/code-coverage.md
    summary: "The agent runs coverage and writes tests for the uncovered branches."
    qualities: [testability]
    speed: [seconds]
  - id: contract-tests
    title: "Contract tests"
    group: testing
    path: testing/contract-tests.md
    summary: "The agent changes a provider and runs contract verification. Before a deploy, the agent runs `pact-broker can-i-deploy`. The command exits with code 0 (\"yes\") or 1 (\"no\")."
    qualities: [compatibility, integrability, deployability]
    stages: [ci]
    speed: [minutes]
  - id: e2e-browser
    title: "E2E through browser automation"
    group: testing
    path: testing/e2e-browser.md
    summary: "The agent starts the dev server and walks a scenario with Playwright or Puppeteer. That is how it finds out that a feature does not work end to end even though the unit tests and `curl` pass."
    qualities: [functional suitability, operability]
    stages: [local, ci]
  - id: executable-docs
    title: "Executable documentation"
    group: testing
    path: testing/executable-docs.md
    summary: "Doctests, and checking API responses against the OpenAPI schema, turn a mismatch between the docs and the code into a failing test."
    qualities: [understandability, self-descriptiveness]
    speed: [seconds]
  - id: fuzzing
    title: "Fuzzing"
    group: testing
    path: testing/fuzzing.md
    summary: "The fuzzer finds a crash. The agent turns the minimal input into a regression test and fixes the code."
    qualities: [robustness, security (resistance)]
    stages: [ci, scheduled]
  - id: integration-tests-emulators
    title: "Integration tests with emulators"
    group: testing
    path: testing/integration-tests-emulators.md
    summary: "The agent starts the real dependencies of the code (database, queue, cloud emulators), runs the tests against them and sees the errors in how the code works with those dependencies."
    qualities: [integrability, interoperability]
    stages: [local, ci]
    speed: [minutes]
  - id: mutation-testing
    title: "Mutation testing"
    group: testing
    path: testing/mutation-testing.md
    summary: "The agent sees surviving mutants — code changes the tests did not notice — and writes tests that catch them."
    qualities: [testability, faultlessness]
    stages: [local, ci]
  - id: property-based-tests
    title: "Property-based tests"
    group: testing
    path: testing/property-based-tests.md
    summary: "The agent states invariants and writes property tests for them. The framework finds a minimal counterexample, and the agent fixes the code."
    qualities: [correctness, robustness]
    stages: [local, ci]
  - id: red-green-tdd
    title: "Unit tests, red/green TDD"
    group: testing
    path: testing/red-green-tdd.md
    summary: "The agent writes a test and makes sure it fails (red). Then it writes the implementation until the run is green, and refactors."
    qualities: [testability, correctness]
    stages: [local]
    speed: [seconds]
  - id: run-tests-first
    title: "Run the tests first"
    group: testing
    path: testing/run-tests-first.md
    summary: "Before changing anything the agent runs the whole suite. It learns the state of the project and which tests already fail, so later it does not mistake them for its own regressions."
    qualities: [testability, reproducibility]
    stages: [local]
  - id: visual-screenshot-check
    title: "Visual check with screenshots"
    group: testing
    path: testing/visual-screenshot-check.md
    summary: "The agent takes a screenshot, compares it with the mockup, lists the differences and fixes them."
    qualities: [interaction capability (user engagement)]
    stages: [local, ci]
  - id: agent-audit-trail
    title: "Audit trail of agent actions"
    group: security
    path: security/agent-audit-trail.md
    summary: "The agent leaves evidence: commands with their output, screenshots, videos, commits. The reviewer checks the evidence instead of re-running everything."
    qualities: [auditability, accountability]
    stages: [task]
  - id: compliance-mutants
    title: "Compliance hardening with mutants"
    group: security
    path: security/compliance-mutants.md
    summary: "An LLM takes one concern, such as data leaks, and generates two things: mutants specific to that concern; tests that catch those mutants."
    qualities: [compliance, privacy]
    stages: [ci, scheduled]
  - id: dast
    title: "DAST"
    group: security
    path: security/dast.md
    summary: "A scanner attacks the preview environment. The agent fixes the vulnerabilities that the scanner finds."
    qualities: [security (resistance)]
    stages: [staging]
    speed: [minutes]
  - id: dependency-scanning-sbom
    title: "Dependency analysis (SCA) and SBOM"
    group: security
    path: security/dependency-scanning-sbom.md
    summary: "The scanner reports a CVE in a dependency the agent added. The agent then picks a safe version."
    qualities: [security, supportability]
    stages: [ci]
  - id: license-check
    title: "License check"
    group: security
    path: security/license-check.md
    summary: "The check fails on a forbidden license; the agent replaces the package."
    qualities: [legal, compliance]
    stages: [ci]
    speed: [seconds]
  - id: sast
    title: "SAST"
    group: security
    path: security/sast.md
    summary: "Semgrep or CodeQL reports a rule, a file and a line; the agent fixes the vulnerable pattern."
    qualities: [security]
    stages: [local, ci]
    speed: [seconds]
  - id: secret-scanning
    title: "Secret scanning"
    group: security
    path: security/secret-scanning.md
    summary: "GitLeaks in pre-commit blocks a commit that contains a secret; the agent moves the secret into environment variables."
    qualities: [confidentiality]
    stages: [commit]
  - id: security-review-agent
    title: "Security and data-handling review by an agent"
    group: security
    path: security/security-review-agent.md
    summary: "A subagent checks the code against a security checklist or against rules such as \"user names never reach the frontend\", and returns findings with line numbers."
    qualities: [security, privacy]
    stages: [scheduled]
    speed: [minutes]
  - id: api-breaking-changes
    title: "Breaking changes in the API"
    group: compatibility
    path: compatibility/api-breaking-changes.md
    summary: "The agent changes a schema, and CI compares it with the schema on main."
    qualities: [compatibility, evolvability]
    stages: [local, ci]
    speed: [seconds]
  - id: config-validation
    title: "Configuration check"
    group: compatibility
    path: compatibility/config-validation.md
    summary: "Two checks catch configuration errors: a validator checks the configuration against its schema; a smoke start runs with each configuration profile."
    qualities: [configurability, installability]
    speed: [seconds]
  - id: db-migration-lint
    title: "Lint and run database migrations"
    group: compatibility
    path: compatibility/db-migration-lint.md
    summary: "A migration linter points at a dangerous operation. The agent rewrites the migration, then applies it and rolls it back on a throwaway database."
    qualities: [compatibility, availability, recoverability]
    stages: [ci]
    speed: [seconds, minutes]
  - id: dependency-updates
    title: "Dependency updates"
    group: compatibility
    path: compatibility/dependency-updates.md
    summary: "Renovate or Dependabot opens a PR; the agent runs the sensors and fixes what broke. A script collects the age and activity of the dependencies, and an LLM writes recommendations."
    qualities: [upgradeability, sustainability]
    stages: [scheduled]
  - id: i18n-pseudolocalization
    title: "i18n and pseudo-localization"
    group: compatibility
    path: compatibility/i18n-pseudolocalization.md
    summary: "A linter finds missing keys and hard-coded strings. E2E on a pseudo-locale shows truncated text."
    qualities: [localizability]
    stages: [ci]
  - id: platform-matrix
    title: "Platform matrix"
    group: compatibility
    path: compatibility/platform-matrix.md
    summary: "CI runs the tests on several operating systems, runtimes and browsers. The agent sees which exact combination failed and fixes it."
    qualities: [adaptability, installability, co-existence]
    stages: [ci]
  - id: benchmarks-vs-baseline
    title: "Benchmarks against a baseline"
    group: performance
    path: performance/benchmarks-vs-baseline.md
    summary: "The agent compares its result with a baseline. If the result is worse than the baseline, the agent optimizes the result."
    qualities: [time behaviour]
    speed: [minutes]
  - id: bundle-size-budget
    title: "Bundle size budget"
    group: performance
    path: performance/bundle-size-budget.md
    summary: "size-limit \"throws an error if the cost exceeds the limit\". With `--why` the agent finds what bloated the bundle and removes it."
    qualities: [resource utilization]
    stages: [ci]
    speed: [seconds]
  - id: lighthouse-ci
    title: "Lighthouse CI"
    group: performance
    path: performance/lighthouse-ci.md
    summary: "`lhci assert` fails on assertions such as `'categories:performance': ['error', {minScore: 0.9}]`. The agent reads the JSON report and `manifest.json`."
    qualities: [performance, accessibility]
    stages: [preview]
    speed: [minutes]
  - id: load-testing
    title: "Load testing"
    group: performance
    path: performance/load-testing.md
    summary: "The agent runs k6, Gatling or Locust against a preview, sees p95 degrade and looks for the bottleneck in the traces."
    qualities: [scalability, elasticity, capacity]
    stages: [staging]
    speed: [minutes]
  - id: perf-budgets-telemetry
    title: "Performance budgets through telemetry"
    group: performance
    path: performance/perf-budgets-telemetry.md
    summary: "The agent gets a performance budget, such as \"the service starts in under 800 ms\" or \"no span on a critical path takes longer than 2 s\". It queries the traces and optimizes the code until the service meets the performance budget (OpenAI's example)."
    qualities: [performance, responsiveness]
    stages: [local]
  - id: profiling
    title: "Profiling"
    group: performance
    path: performance/profiling.md
    summary: "The agent takes a CPU or memory profile as text (the top N functions), makes a fix and compares the new profile with the original."
    qualities: [resource utilization, energy efficiency]
    stages: [local]
  - id: browser-console-devtools
    title: "Browser console and DevTools"
    group: observability
    path: observability/browser-console-devtools.md
    summary: "The agent reads the page's console errors and network requests and fixes JS exceptions and 4xx/5xx responses."
    qualities: [debuggability]
    speed: [seconds]
  - id: debugger-repl
    title: "Debugger and REPL"
    group: observability
    path: observability/debugger-repl.md
    summary: "The agent sets a breakpoint or opens a REPL and checks its hypothesis against real values instead of guessing."
    qualities: [debuggability]
    speed: [seconds]
  - id: metrics-promql
    title: "Metrics (PromQL)"
    group: observability
    path: observability/metrics-promql.md
    summary: "The agent runs a scenario and compares error counters, latency and resource use with what it expects."
    qualities: [observability, availability]
    speed: [seconds]
  - id: structured-logs
    title: "Structured logs and log queries"
    group: observability
    path: observability/structured-logs.md
    summary: "The agent starts the application, queries the logs (at OpenAI: LogQL against an ephemeral VictoriaLogs per worktree), finds the error and fixes it."
    qualities: [observability, debuggability]
    stages: [local]
    speed: [seconds]
  - id: traces-opentelemetry
    title: "Traces (OpenTelemetry)"
    group: observability
    path: observability/traces-opentelemetry.md
    summary: "The agent queries traces (TraceQL) and finds a slow or failed span."
    qualities: [analysability, performance]
    speed: [seconds]
  - id: backup-restore-rollback
    title: "Restore from backup and rollback"
    group: reliability
    path: reliability/backup-restore-rollback.md
    summary: "A job restores the database from a backup and rolls the release back. When the check fails, the agent fixes the procedure."
    qualities: [recoverability, durability]
    stages: [scheduled]
  - id: chaos-engineering
    title: "Chaos engineering"
    group: reliability
    path: reliability/chaos-engineering.md
    summary: "Pods or zones are killed in staging. From the alerts and SLOs the agent finds the recovery mechanism that is missing."
    qualities: [availability, recoverability, continuity]
    stages: [staging]
  - id: fault-injection
    title: "Fault injection (Toxiproxy)"
    group: reliability
    path: reliability/fault-injection.md
    summary: "A test calls the Toxiproxy HTTP API (port 8474) to add latency, a timeout or an outage to a dependency. Toxiproxy does not report pass or fail. Your test does."
    qualities: [fault tolerance, resilience]
    stages: [local, ci]
  - id: health-checks-smoke
    title: "Health checks and smoke tests after deploy"
    group: reliability
    path: reliability/health-checks-smoke.md
    summary: "The agent polls `/health` and `/ready` and runs a smoke suite. When the result is red, it reads the startup logs."
    qualities: [availability, operability]
    stages: [preview, staging]
    speed: [seconds]
  - id: canary-feature-flags
    title: "Canaries and feature flags"
    group: delivery
    path: delivery/canary-feature-flags.md
    summary: "An analysis compares the canary release with the baseline. If the canary performs worse, the release rolls back automatically, and the agent gets the metrics."
    qualities: [deployability, availability]
    stages: [production]
  - id: ci-clean-infra
    title: "CI on clean infrastructure"
    group: delivery
    path: delivery/ci-clean-infra.md
    summary: "The agent pushes; autofixes apply themselves; the agent fixes the remaining failures locally."
    qualities: [reproducibility, deployability]
    stages: [ci]
    speed: [minutes]
  - id: isolated-environment
    title: "Isolated reproducible environment"
    group: delivery
    path: delivery/isolated-environment.md
    summary: "At the start of every task, the agent gets a clean environment: a devbox, a devcontainer, or a worktree with its own instance of the app. The aim is that the sensors give the same result for the same code."
    qualities: [reproducibility, safety (limits the blast radius)]
    stages: [task]
  - id: pre-commit-pre-push
    title: "Pre-commit / pre-push"
    group: delivery
    path: delivery/pre-commit-pre-push.md
    summary: "Fast checks run when the agent commits or pushes. If a check fails, it rejects the commit before the change reaches CI. The one check it names is linting, in Stripe's case below."
    qualities: [maintainability, security]
    stages: [commit]
    speed: [sub-second]
  - id: preview-environments
    title: "Preview environments per PR"
    group: delivery
    path: delivery/preview-environments.md
    summary: "Every PR gets its own deployed environment. The agent runs e2e, DAST, Lighthouse and load tests against it and reads its logs."
    qualities: [deployability, integrability]
    stages: [preview]
    speed: [minutes]
  - id: stop-hook
    title: "Stop hook / `/goal`"
    group: delivery
    path: delivery/stop-hook.md
    summary: "A hook runs a check and does not let the agent end its turn until the check passes."
    qualities: [any attribute a script can check]
    stages: [local]
  - id: ai-judges-telemetry
    title: "AI judges on telemetry"
    group: production
    path: production/ai-judges-telemetry.md
    summary: "An AI judge is an LLM that checks a sample of responses and a sample of logs. It marks the anomalies it finds."
    qualities: [quality in use]
    stages: [continuous]
  - id: error-tracking
    title: "Error tracking (Sentry)"
    group: production
    path: production/error-tracking.md
    summary: "Through Sentry MCP the agent gets the top errors, their stack traces and Seer's root-cause analysis. It reproduces an error with a test, fixes it, and after the release checks that the error rate went down."
    qualities: [faultlessness, operability]
    stages: [production]
  - id: slo-degradation
    title: "SLO degradation"
    group: production
    path: production/slo-degradation.md
    summary: "The agent watches the SLOs for latency, errors and availability and proposes fixes (Böckeler's example)."
    qualities: [availability, reliability]
    stages: [production]
  - id: user-feedback
    title: "User feedback"
    group: production
    path: production/user-feedback.md
    summary: "A person turns user feedback into acceptance criteria. The agent gets these criteria and uses them as both the spec for its work and the test of that work."
    qualities: [functional suitability, satisfaction]
    speed: [days]
  - id: accessibility-checks
    title: "Accessibility checks (axe, ARIA)"
    group: interaction
    path: interaction/accessibility-checks.md
    summary: "`@axe-core/playwright` finds WCAG violations and gives the selector for each one. `toMatchAriaSnapshot` catches structural problems that axe misses."
    qualities: [inclusivity, user assistance]
    speed: [seconds]
  - id: accessibility-tree-navigation
    title: "Agent navigation by the accessibility tree"
    group: interaction
    path: interaction/accessibility-tree-navigation.md
    summary: "Playwright MCP gives the agent an accessibility snapshot of the page instead of pixels."
    qualities: [operability, self-descriptiveness]
    speed: [seconds]
  - id: ux-evaluator
    title: "UX evaluator with thresholds"
    group: interaction
    path: interaction/ux-evaluator.md
    summary: "A separate agent walks through the app with Playwright MCP the way a user would, and grades it on criteria: depth, functionality, design, code. If any criterion is below its threshold, the sprint fails, and the generator gets a detailed breakdown (\"FAIL — `PUT /frames/reorder` route defined after `/{frame_id}`…\")."
    qualities: [user engagement, functional completeness]
    stages: [sprint]
  - id: agent-code-review
    title: "Code review by another agent"
    group: meta
    path: meta/agent-code-review.md
    summary: "The coding agent asks one or more reviewer agents, each with a fresh context, for a review. It fixes their comments until the reviewer agents are satisfied. At OpenAI almost all review happens between agents."
    qualities: [maintainability, correctness]
    speed: [minutes]
  - id: document-review
    title: "Review of document texts"
    group: meta
    path: meta/document-review.md
    summary: "The agent does not write the document itself. It writes a brief. A separate writer writes the text from the brief, and then the text is checked."
    qualities: [understandability, correctness]
    stages: [local]
    speed: [minutes]
  - id: garbage-collection
    title: "Garbage collection"
    group: meta
    path: meta/garbage-collection.md
    summary: "On a schedule, background agents look for code that breaks the \"golden principles\" written down in the repository, and open small PRs to fix it. At OpenAI, reviewing most of these PRs took under a minute, and they were merged automatically."
    qualities: [maintainability, evolvability]
    stages: [scheduled]
  - id: llm-evals
    title: "Eval suites for LLM features"
    group: meta
    path: meta/llm-evals.md
    summary: "The agent changes a prompt and runs the evals; a drop in the metric counts as a failure."
    qualities: [correctness of non-deterministic components]
    speed: [minutes]
  - id: progress-file-feature-list
    title: "Progress file and feature list"
    group: meta
    path: meta/progress-file-feature-list.md
    summary: "An initializer creates a JSON list of features, each with `\"passes\": false`. Every session takes one feature and marks it as passing only after an e2e check."
    qualities: [process recoverability, auditability]
    stages: [task]
  - id: steering-loop
    title: "Steering loop"
    group: meta
    path: meta/steering-loop.md
    summary: "A mistake the agent keeps repeating becomes a new guide or sensor."
    qualities: [process evolvability]
    stages: [continuous]
  - id: verification-subagent
    title: "Verification subagent"
    group: meta
    path: meta/verification-subagent.md
    summary: "When the working agent says a task is done, a separate verification subagent tries to prove that claim wrong. One round takes minutes."
    qualities: [correctness, auditability]
    speed: [minutes]
  - id: async-questions-with-assumptions
    title: "Asynchronous questions with assumptions"
    group: human
    path: human/async-questions-with-assumptions.md
    summary: "The agent does not ask a non-blocking question right away. It writes the question down together with the assumption it made, and keeps working. At the end of the task, the person gets all these questions as one batch and confirms or cancels each assumption."
    when: [during, after]
    initiator: agent
    sync: async
    stages: [task]
    speed: [minutes]
  - id: choose-from-options
    title: "Choose from options"
    group: human
    path: human/choose-from-options.md
    summary: "On questions of taste — UI, naming, the shape of an API, the structure of a module — the agent makes 2–3 options. The person picks one and briefly explains why."
    when: [during, after]
    initiator: agent
    assesses: [result, code]
    speed: [minutes]
  - id: correction-becomes-rule
    title: "Steering: every correction becomes a rule"
    group: human
    path: human/correction-becomes-rule.md
    summary: "The loop starts only on a repeat. A single correction does not start it. When the person has corrected the agent twice for the same thing, the correction becomes an automated sensor (a lint, a test, a fitness function) or a line in CLAUDE.md."
    initiator: human
    stages: [continuous]
    speed: [minutes]
  - id: escalation-on-uncertainty
    title: "Escalation on uncertainty"
    group: human
